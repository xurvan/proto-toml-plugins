# A YAML plugin for proto:
# https://moonrepo.dev/docs/proto/non-wasm-plugin

name: pyoxidizer
type: cli

resolve:
  git-url: https://github.com/indygreg/PyOxidizer/

platform:
  linux:
    download-file: pyoxidizer-{version}-{arch}-unknown-linux-musl.tar.gz
    exe-path: pyoxidizer-{version}-{arch}-unknown-linux-musl/pyoxidizer
  macos:
    download-file: pyoxidizer-{version}-{arch}-apple-darwin.tar.gz
    exe-path: pyoxidizer-{version}-{arch}-apple-darwin/pyoxidizer
  windows:
    download-file: pyoxidizer-{version}-{arch}-pc-windows-msvc.tar.gz
    exe-path: pyoxidizer-{version}-{arch}-pc-windows-msvc/pyoxidizer.exe

install:
  download-url: https://github.com/indygreg/PyOxidizer/releases/download/pyoxidizer/{version}/{download_file}
